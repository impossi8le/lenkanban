name: Canonical Linux visual comparisons

on:
  push:
  workflow_dispatch:
    inputs:
      capture:
        description: Generate provisional references for human review (never commits them)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: canonical-visual-database
  cancel-in-progress: false

jobs:
  visual:
    # Separate prepared test DB: the legacy ci.yml lane has not been reviewed.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.RUN_CANONICAL_VISUAL_TESTS == 'true' }}
    runs-on: ubuntu-24.04
    environment: integration-tests
    timeout-minutes: 55
    env:
      E2E_DATABASE_URL: ${{ secrets.VISUAL_E2E_DATABASE_URL }}
      VISUAL_CI_CAPTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.capture && '1' || '0' }}
      E2E_CI_UPDATE_BASELINES: ${{ github.event_name == 'workflow_dispatch' && inputs.capture && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned rendering environment (no application or secrets in context)
        run: docker build --platform=linux/amd64 --tag lenkanban-visual-ci --file deploy/visual-ci/Dockerfile deploy/visual-ci
      - name: Compare or explicitly capture the complete matrix
        shell: bash
        run: |
          docker run --rm --init --cap-drop ALL --security-opt no-new-privileges --shm-size=1g --memory=4g --cpus=2 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/build" \
            --env E2E_DATABASE_URL --env VISUAL_CI_CAPTURE --env E2E_CI_UPDATE_BASELINES --env GITHUB_EVENT_NAME \
            --env CI=true --env E2E_UPDATE_BASELINES=0 --env E2E_PRODUCTION_SERVER=1 --env E2E_SOCKET=0 \
            --env PLAYWRIGHT_BASE_URL=http://127.0.0.1:3555 --env PLAYWRIGHT_EXTERNAL_SERVER=0 \
            --env DATABASE_URL= \
            --env TEST_DATABASE_URL= --env PRODUCTION_DATABASE_URL= \
            --env SMTP_HOST=127.0.0.1 --env SMTP_PORT=9 --env SENTRY_DSN= --env NEXT_PUBLIC_SENTRY_DSN= \
            --env ATTACHMENT_STORAGE=local --env E2E_ATTACHMENT_DIR=/build/e2e/artifacts/storage \
            --entrypoint bash lenkanban-visual-ci deploy/visual-ci/run.sh
      - name: Retain synthetic comparisons and renderer proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-visual-${{ github.run_attempt }}
          path: |
            e2e/artifacts/report/
            e2e/artifacts/results/
            e2e/artifacts/results.json
            e2e/artifacts/renderer.json
            e2e/artifacts/provisional-baselines/
          if-no-files-found: warn
          retention-days: 7
