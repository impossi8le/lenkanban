openapi: 3.0.3
info:
  title: Kanban V2 API
  description: |
    Partial historical REST API specification. Source review: 2026-10-20. See docs/API.md for the current route inventory; paths and schemas below are not fully synchronized and must be verified before client generation.

    ## Authentication
    Authentication is route-specific; the following mechanisms are not supported by every route:
    - Session cookie (NextAuth)
    - Bearer token in Authorization header

    ## Response Format
    Many routes use the following helpers, but NextAuth, auth preflight and some error responses differ:

    **Success Response:**
    ```json
    {
      "success": true,
      "data": { ... },
      "meta": { "page": 1, "limit": 20, "total": 100 }
    }
    ```

    **Error Response:**
    ```json
    {
      "success": false,
      "error": {
        "code": "ERROR_CODE",
        "message": "Human readable message",
        "details": { ... }
      }
    }
    ```
  version: 1.0.0
  contact:
    name: API Support
    url: https://kanban.lenremontn8n.ru
  license:
    name: Private

servers:
  - url: https://kanban.lenremontn8n.ru/api
    description: Configured public origin; live state not verified on 2026-10-20
  - url: http://localhost:3555/api
    description: Development server

tags:
  - name: Authentication
    description: User authentication and registration
  - name: Projects
    description: Project management
  - name: Tasks
    description: Task management
  - name: Columns
    description: Project columns (Kanban board columns)
  - name: Tags
    description: Task tags
  - name: Members
    description: Project members management
  - name: Analytics
    description: Project analytics and reports
  - name: Notifications
    description: User notifications
  - name: Templates
    description: Task and project templates
  - name: Automation
    description: Automation rules
  - name: Admin
    description: Admin-only endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: kb2 opaque API token
    cookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token

  schemas:
    ApiSuccess:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
        meta:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            hasMore:
              type: boolean

    ApiError:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - VALIDATION_ERROR
                - INVALID_JSON
                - RATE_LIMITED
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: object

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        globalRole:
          type: string
          enum: [USER, ADMIN]
        emailVerified:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        ownerId:
          type: string
        owner:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        _count:
          type: object
          properties:
            tasks:
              type: integer
            members:
              type: integer

    ProjectColumn:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        name:
          type: string
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        position:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Task:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE]
        priority:
          type: string
          enum: [URGENT, HIGH, MEDIUM, LOW]
        position:
          type: integer
        projectId:
          type: string
        columnId:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Attachment:
      type: object
      properties:
        url:
          type: string
          format: uri
        name:
          type: string
        size:
          type: integer
        mime:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true

    Tag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        projectId:
          type: string
        createdAt:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        type:
          type: string
          enum:
            - task_assigned
            - task_mentioned
            - task_status_changed
            - task_deadline_approaching
            - project_member_added
            - chat_message
        title:
          type: string
        message:
          type: string
        read:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
        actionUrl:
          type: string
          nullable: true
        metadata:
          type: object
        createdAt:
          type: string
          format: date-time

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /projects:
    get:
      tags:
        - Projects
      summary: List all projects
      description: Returns all projects the user has access to
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    post:
      tags:
        - Projects
      summary: Create new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /projects/{id}:
    get:
      tags:
        - Projects
      summary: Get project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    patch:
      tags:
        - Projects
      summary: Update project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                description:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'

    delete:
      tags:
        - Projects
      summary: Delete project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string

  /tasks:
    get:
      tags:
        - Tasks
      summary: List tasks
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE]
        - name: priority
          in: query
          schema:
            type: string
            enum: [URGENT, HIGH, MEDIUM, LOW]
        - name: assigneeId
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [position, createdAt, updatedAt, deadline, priority, title]
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Task'

    post:
      tags:
        - Tasks
      summary: Create new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - projectId
                - columnId
              properties:
                title:
                  type: string
                  minLength: 1
                description:
                  type: string
                priority:
                  type: string
                  enum: [URGENT, HIGH, MEDIUM, LOW]
                projectId:
                  type: string
                columnId:
                  type: string
                deadline:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Task'

  /notifications:
    get:
      tags:
        - Notifications
      summary: Get user notifications
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Notification'

  /notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: Get unread notification count
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count:
                            type: integer

  /analytics:
    get:
      tags:
        - Analytics
      summary: Get analytics data
      parameters:
        - name: projectId
          in: query
          schema:
            type: string
          description: If omitted, returns global analytics
      responses:
        '200':
          description: Analytics data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tasksByStatus:
                            type: array
                            items:
                              type: object
                              properties:
                                status:
                                  type: string
                                count:
                                  type: integer
                          tasksByPriority:
                            type: array
                            items:
                              type: object
                              properties:
                                priority:
                                  type: string
                                count:
                                  type: integer
                          summary:
                            type: object
                            properties:
                              totalTasks:
                                type: integer
                              completedThisMonth:
                                type: integer
                              overdueTasks:
                                type: integer

