name: lenkanban-local
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kanban_local
      POSTGRES_PASSWORD: local_only_change_me
      POSTGRES_DB: kanban_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kanban_local_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban_local -d kanban_local"]
      interval: 5s
      timeout: 5s
      retries: 15
  mail:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  kanban_local_db:
